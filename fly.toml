app = "castlefield-v2"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  CF_ROOT = "/app"
  CF_REDB_PATH = "/app/data-store/castlefield.redb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "castlefield_data"
  destination = "/app/data-store"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
