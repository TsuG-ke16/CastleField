<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>軽量フィールド背景6種</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f3ecde;color:#392e24;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1180px;margin:auto}h1{font-size:28px;margin:0}h2{font-size:20px;margin:0 0 10px}p{margin:8px 0 18px}a{color:#60421c}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{padding:16px;background:#fffaf1;border:1px solid #c5b18d;border-radius:12px;min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}figcaption{text-align:center;font-size:13px;padding-top:5px}.small{font-size:12px;color:#746149}.links{display:flex;gap:14px;flex-wrap:wrap}@media(max-width:600px){body{padding:12px}main{grid-template-columns:1fr}h1{font-size:23px}}</style>
<header><h1>軽量フィールド背景6種</h1><p>地面と外周の少数の小物で構成。Blenderで部品を使い回しやすいデザイン。</p><p id="capacity"></p><p><a href="README.md">Blender向け部品・軽量化ガイド</a></p></header><main></main>
<script type="module">
const d=await(await fetch('catalog.json')).json(),assets=new URL('../../',location.href),url=p=>new URL(p,assets).href;
document.querySelector('#capacity').textContent=`576×1024 / 各150KB以下 / 6枚合計 ${(d.totalRuntimeBytes/1024).toFixed(0)}KB`;
for(const s of d.stages){const a=document.createElement('article');a.innerHTML=`<h2>${s.label}</h2><div class="pair"><figure><img src="${url(s.before)}" alt="${s.label}の変更前"><figcaption>変更前</figcaption></figure><figure><img src="${url(s.path)}" alt="${s.label}の新しい背景"><figcaption>今回の背景</figcaption></figure></div><p class="small">${(s.bytes/1024).toFixed(0)}KB</p><div class="links"><a href="game/${s.slug}-390.png">ゲーム上の表示</a><a href="${url(s.source)}">制作原画</a></div>`;document.querySelector('main').append(a)}
await Promise.all([...document.images].map(i=>i.decode()));document.documentElement.dataset.ready='true';
</script></html>
